name: Build Alpine APK for ARMHF

on:
  push:
    tags:
      - 'v*' 
  workflow_dispatch: # 1. 添加手动触发
    inputs: # 2. 定义手动触发时的输入参数
      debug_mode:
        description: 'Enable Debug Build'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      alpine_version:
        description: 'Alpine Linux Version'
        required: false
        default: '3.19'
        type: choice
        options:
          - '3.19'
          - '3.20'
          - 'edge'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ... (QEMU setup 保持不变) ...

      - name: Build APK in Alpine Container
        run: |
          # 3. 如何根据手动输入选择 Alpine 版本？
          # 如果是手动触发，使用 inputs.alpine_version，否则默认 3.19
          ALPINE_VER="${{ github.event.inputs.alpine_version || '3.19' }}"
          
          # 4. 如何区分构建模式？
          DEBUG_FLAG="${{ github.event.inputs.debug_mode == 'true' && '--enable-debug' || '--disable-debug' }}"

          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace alpine:$ALPINE_VER sh -c '
            set -e
            # 安装依赖 (注意：不同 Alpine 版本包名可能微调)
            apk add --no-cache abuild build-base bash autoconf automake libtool \
              sdl2-dev sdl2_net-dev libpng-dev freetype-dev zlib-dev \
              file lddtree
            
            # 配置 abuild
            mkdir -p ~/.abuild
            cp /etc/apk/keys/*.rsa.pub ~/.abuild/
            echo "PACKAGER_PRIVKEY=/workspace/apkkey" >> ~/.abuild/abuild.conf
            abuild-keygen -a -n
            
            cd /workspace
            # 更新版本
            export PKGVER=${GITHUB_REF#refs/tags/v}
            # 如果是手动触发且没有 tag，PKGVER 可能是空的，需要处理
            if [ -z "$PKGVER" ] || [ "$PKGVER" = "$GITHUB_REF" ]; then
              PKGVER="dev-$(date +%Y%m%d)"
            fi
            sed -i "s/pkgver=.*/pkgver=$PKGVER/" APKBUILD
            
            # 5. 将调试参数传递给 configure
            # 您觉得这里直接修改 APKBUILD 好，还是通过环境变量传递好？
            sed -i "s|--disable-sdl2-test|--disable-sdl2-test $DEBUG_FLAG|" APKBUILD
            
            abuild -F -r
            
            # 生成初始化脚本
            DEPS=$(grep "^depends=" APKBUILD | cut -d'"' -f2 | tr " " "\n" | grep -v "^$" | sed "s/^/apk add --no-cache /" | tr "\n" ";" )
            cat > /workspace/dosbox-x-init.sh << EOF
#!/bin/sh
echo "Initializing dosbox-x..."
$DEPS
export SDL_AUDIODRIVER=alsa
export DISPLAY=:0
echo "Done."
EOF
            chmod +x /workspace/dosbox-x-init.sh
            
            mkdir -p /workspace/release
            cp ~/packages/armhf/*.apk /workspace/release/
            cp /workspace/dosbox-x-init.sh /workspace/release/
          '

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          # 6. 如何命名 artifacts 以便区分？
          name: dosbox-x-alpine-armhf-${{ github.event_name == 'workflow_dispatch' && 'test' || 'release' }}
          path: release/
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 1 || 30 }}
