name: Build Alpine APK for ARMHF

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Enable Debug Build'
        required: false
        default: false
        type: boolean
      alpine_version:
        description: 'Alpine Linux Version (e.g., 3.19, 3.20, edge)'
        required: false
        default: '3.19'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build APK in Alpine Container
        run: |
          ALPINE_VER="${{ github.event.inputs.alpine_version || '3.19' }}"
          DEBUG_ENABLED="${{ github.event.inputs.debug_mode || false }}"
          PKGVER="${{ github.ref_type == 'tag' && github.ref_name || 'dev-' }}"
          
          if [ "$PKGVER" = "dev-" ]; then
            PKGVER="dev-$(date +%Y%m%d%H%M)"
          fi

          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e DEBUG_ENABLED="$DEBUG_ENABLED" \
            -e PKGVER="$PKGVER" \
            "alpine:$ALPINE_VER" \
            /bin/sh -c '
              set -e
              
              echo "=== Workspace Files ==="
              ls -la /workspace
              
              apk add --no-cache abuild build-base bash autoconf automake libtool \
                sdl2-dev sdl2_net-dev libpng-dev freetype-dev zlib-dev \
                file lddtree git ca-certificates
              
              mkdir -p ~/.abuild
              cp /etc/apk/keys/*.rsa.pub ~/.abuild/ 2>/dev/null || true
              echo "PACKAGER_PRIVKEY=/workspace/apkkey" >> ~/.abuild/abuild.conf
              abuild-keygen -a -n
              
              cd /workspace
              
              # 使用 printf 逐行生成 APKBUILD，避免 heredoc 问题
              printf "%s\n" "# Maintainer: 主人" > APKBUILD
              printf "%s\n" "pkgname=dosbox-x" >> APKBUILD
              printf "%s\n" "pkgver=$PKGVER" >> APKBUILD
              printf "%s\n" "pkgrel=1" >> APKBUILD
              printf "%s\n" "pkgdesc=\"DOSBox-X fork for Raspberry Pi\"" >> APKBUILD
              printf "%s\n" "url=\"https://github.com/RobertWang/dosbox-x-4-rpia\"" >> APKBUILD
              printf "%s\n" "arch=\"armhf\"" >> APKBUILD
              printf "%s\n" "license=\"GPL-2.0-or-later\"" >> APKBUILD
              printf "%s\n" "depends=\"sdl2 sdl2_net libpng freetype zlib\"" >> APKBUILD
              printf "%s\n" "makedepends=\"build-base sdl2-dev sdl2_net-dev libpng-dev freetype-dev zlib-dev autoconf automake libtool git\"" >> APKBUILD
              printf "%s\n" "options=\"!check\"" >> APKBUILD
              printf "%s\n" "" >> APKBUILD
              printf "%s\n" "source=\"\$pkgname-\$pkgver.tar.gz::https://github.com/RobertWang/dosbox-x-4-rpia/archive/refs/tags/v\$pkgver.tar.gz\"" >> APKBUILD
              printf "%s\n" "" >> APKBUILD
              printf "%s\n" "build() {" >> APKBUILD
              printf "%s\n" "    cd \"\$srcdir/\$pkgname-\$pkgver\"" >> APKBUILD
              printf "%s\n" "    ./buildconf" >> APKBUILD
              printf "%s\n" "    ./configure --host=armv7-alpine-linux-musleabihf --prefix=/usr --disable-sdl2-test" >> APKBUILD
              printf "%s\n" "    make" >> APKBUILD
              printf "%s\n" "}" >> APKBUILD
              printf "%s\n" "" >> APKBUILD
              printf "%s\n" "package() {" >> APKBUILD
              printf "%s\n" "    cd \"\$srcdir/\$pkgname-\$pkgver\"" >> APKBUILD
              printf "%s\n" "    make DESTDIR=\"\$pkgdir\" install" >> APKBUILD
              printf "%s\n" "}" >> APKBUILD
              
              echo "=== APKBUILD Content ==="
              cat APKBUILD
              
              if [ "$DEBUG_ENABLED" = "true" ]; then
                echo "Enabling debug mode..."
                sed -i "s|--disable-sdl2-test|--disable-sdl2-test --enable-debug|" APKBUILD
              fi
              
              abuild -F -r
              
              DEPS=$(grep "^depends=" APKBUILD | cut -d"\"" -f2 | tr " " "\n" | grep -v "^$" | sed "s/^/apk add --no-cache /" | tr "\n" ";" )
              
              printf "%s\n" "#!/bin/sh" > /workspace/dosbox-x-init.sh
              printf "%s\n" "echo \"Initializing dosbox-x...\"" >> /workspace/dosbox-x-init.sh
              printf "%s\n" "$DEPS" >> /workspace/dosbox-x-init.sh
              printf "%s\n" "export SDL_AUDIODRIVER=alsa" >> /workspace/dosbox-x-init.sh
              printf "%s\n" "export DISPLAY=:0" >> /workspace/dosbox-x-init.sh
              printf "%s\n" "echo \"Done.\"" >> /workspace/dosbox-x-init.sh
              
              chmod +x /workspace/dosbox-x-init.sh
              
              mkdir -p /workspace/release
              cp ~/packages/armhf/*.apk /workspace/release/
              cp /workspace/dosbox-x-init.sh /workspace/release/
            '

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "dosbox-x-alpine-armhf-${{ github.event_name == 'workflow_dispatch' && 'test' || 'release' }}"
          path: release/
          retention-days: "${{ github.event_name == 'workflow_dispatch' && 1 || 30 }}"
