name: Build Alpine APK for ARMHF

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Enable Debug Build'
        required: false
        default: false
        type: boolean
      alpine_version:
        description: 'Alpine Linux Version (e.g., 3.19, 3.20, edge)'
        required: false
        default: '3.19'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build APK in Alpine Container
        run: |
          ALPINE_VER="${{ github.event.inputs.alpine_version || '3.19' }}"
          DEBUG_ENABLED="${{ github.event.inputs.debug_mode || false }}"
          IS_TAG="${{ github.ref_type == 'tag' && 'true' || 'false' }}"
          
          if [ "$IS_TAG" = "true" ]; then
            PKGVER="${{ github.ref_name }}"
            PKGVER="${PKGVER#v}"
          else
            PKGVER="0.0.0_git$(date +%Y%m%d%H%M)"
          fi

          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e DEBUG_ENABLED="$DEBUG_ENABLED" \
            -e PKGVER="$PKGVER" \
            -e IS_TAG="$IS_TAG" \
            "alpine:${ALPINE_VER}" \
            /bin/sh -c '
              set -e
              
              echo "=== Installing dependencies ==="
              apk add --no-cache abuild build-base bash autoconf automake libtool \
                sdl2-dev sdl2_net-dev libpng-dev freetype-dev zlib-dev \
                file git ca-certificates openssl su-exec
              
              echo "=== Creating non-root user for abuild ==="
              addgroup -S abuild
              adduser -S -G abuild -h /home/abuild -s /bin/sh abuild
              mkdir -p /home/abuild
              chown -R abuild:abuild /home/abuild
              
              echo "=== Setting up abuild environment ==="
              mkdir -p /home/abuild/.abuild
              cp /etc/apk/keys/*.rsa.pub /home/abuild/.abuild/ 2>/dev/null || true
              
              echo "CARCH=armhf" >> /home/abuild/.abuild/abuild.conf
              echo "CHOST=armv7-alpine-linux-musleabihf" >> /home/abuild/.abuild/abuild.conf
              echo "PACKAGER_PRIVKEY=/home/abuild/apkkey" >> /home/abuild/.abuild/abuild.conf
              
              chown -R abuild:abuild /home/abuild/.abuild
              
              echo "=== Generating signing key ==="
              su-exec abuild abuild-keygen -a -n
              
              echo "=== Preparing workspace ==="
              cp -r /workspace /home/abuild/workspace
              chown -R abuild:abuild /home/abuild/workspace
              cd /home/abuild/workspace
              
              echo "=== Generating APKBUILD ==="
              printf "%s\n" "# Maintainer: Owner" > APKBUILD
              printf "%s\n" "pkgname=dosbox-x" >> APKBUILD
              printf "%s\n" "pkgver=${PKGVER}" >> APKBUILD
              printf "%s\n" "pkgrel=1" >> APKBUILD
              printf "%s\n" "pkgdesc=\"DOSBox-X fork for Raspberry Pi\"" >> APKBUILD
              printf "%s\n" "url=\"https://github.com/RobertWang/dosbox-x-4-rpia\"" >> APKBUILD
              printf "%s\n" "arch=\"armhf\"" >> APKBUILD
              printf "%s\n" "license=\"GPL-2.0-or-later\"" >> APKBUILD
              printf "%s\n" "depends=\"sdl2 sdl2_net libpng freetype zlib\"" >> APKBUILD
              printf "%s\n" "makedepends=\"build-base sdl2-dev sdl2_net-dev libpng-dev freetype-dev zlib-dev autoconf automake libtool git\"" >> APKBUILD
              printf "%s\n" "options=\"!check\"" >> APKBUILD
              
              if [ "$IS_TAG" = "true" ]; then
                printf "%s\n" "source=\"\$pkgname-\$pkgver.tar.gz::https://github.com/RobertWang/dosbox-x-4-rpia/archive/refs/tags/v\$pkgver.tar.gz\"" >> APKBUILD
                printf "%s\n" "" >> APKBUILD
                printf "%s\n" "build() {" >> APKBUILD
                printf "%s\n" "    cd \"\$srcdir/\$pkgname-\$pkgver\"" >> APKBUILD
                printf "%s\n" "    ./buildconf" >> APKBUILD
                printf "%s\n" "    ./configure --host=armv7-alpine-linux-musleabihf --prefix=/usr --disable-sdl2-test" >> APKBUILD
                printf "%s\n" "    make" >> APKBUILD
                printf "%s\n" "}" >> APKBUILD
                printf "%s\n" "" >> APKBUILD
                printf "%s\n" "package() {" >> APKBUILD
                printf "%s\n" "    cd \"\$srcdir/\$pkgname-\$pkgver\"" >> APKBUILD
                printf "%s\n" "    make DESTDIR=\"\$pkgdir\" install" >> APKBUILD
                printf "%s\n" "}" >> APKBUILD
              else
                printf "%s\n" "source=\"dosbox-x-src.tar.gz\"" >> APKBUILD
                printf "%s\n" "" >> APKBUILD
                printf "%s\n" "build() {" >> APKBUILD
                printf "%s\n" "    cd \"\$srcdir/dosbox-x\"" >> APKBUILD
                printf "%s\n" "    ./buildconf" >> APKBUILD
                printf "%s\n" "    ./configure --host=armv7-alpine-linux-musleabihf --prefix=/usr --disable-sdl2-test" >> APKBUILD
                printf "%s\n" "    make" >> APKBUILD
                printf "%s\n" "}" >> APKBUILD
                printf "%s\n" "" >> APKBUILD
                printf "%s\n" "package() {" >> APKBUILD
                printf "%s\n" "    cd \"\$srcdir/dosbox-x\"" >> APKBUILD
                printf "%s\n" "    make DESTDIR=\"\$pkgdir\" install" >> APKBUILD
                printf "%s\n" "}" >> APKBUILD
              fi
              
              if [ "$IS_TAG" = "false" ]; then
                echo "=== Creating source tarball ==="
                tar -czf /tmp/dosbox-x-src.tar.gz \
                  --exclude=".git" \
                  --exclude=".github" \
                  --exclude="release" \
                  --exclude="*.apk" \
                  --exclude="*.tar.gz" \
                  .
                cp /tmp/dosbox-x-src.tar.gz /home/abuild/workspace/
                chown abuild:abuild /home/abuild/workspace/dosbox-x-src.tar.gz
              fi
              
              echo "=== APKBUILD Content ==="
              cat APKBUILD
              
              echo "=== Generating checksums ==="
              su-exec abuild abuild checksum
              cat checksums
              
              if [ "$DEBUG_ENABLED" = "true" ]; then
                echo "=== Enabling debug mode ==="
                sed -i "s|--disable-sdl2-test|--disable-sdl2-test --enable-debug|" APKBUILD
              fi
              
              echo "=== Starting abuild ==="
              su-exec abuild abuild -F -r
              
              echo "=== Searching for APK files ==="
              find /home/abuild/packages -name "*.apk" 2>/dev/null || true
              
              mkdir -p /workspace/release
              if [ -d /home/abuild/packages/armhf ]; then
                cp /home/abuild/packages/armhf/*.apk /workspace/release/
                echo "Copied from /home/abuild/packages/armhf/"
              elif [ -d /home/abuild/packages ]; then
                cp /home/abuild/packages/*.apk /workspace/release/ 2>/dev/null || true
                echo "Copied from /home/abuild/packages/"
              else
                echo "WARNING: No packages directory found!"
                find /home/abuild -name "*.apk" 2>/dev/null || true
              fi
              
              DEPS=$(grep "^depends=" APKBUILD | cut -d"\"" -f2 | tr " " "\n" | grep -v "^$" | sed "s/^/apk add --no-cache /" | tr "\n" ";" )
              
              printf "%s\n" "#!/bin/sh" > /workspace/dosbox-x-init.sh
              printf "%s\n" "echo \"Initializing dosbox-x...\"" >> /workspace/dosbox-x-init.sh
              printf "%s\n" "$DEPS" >> /workspace/dosbox-x-init.sh
              printf "%s\n" "export SDL_AUDIODRIVER=alsa" >> /workspace/dosbox-x-init.sh
              printf "%s\n" "export DISPLAY=:0" >> /workspace/dosbox-x-init.sh
              printf "%s\n" "echo \"Done.\"" >> /workspace/dosbox-x-init.sh
              
              chmod +x /workspace/dosbox-x-init.sh
              cp /workspace/dosbox-x-init.sh /workspace/release/
              
              echo "=== Release Files ==="
              ls -la /workspace/release/
            '

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "dosbox-x-alpine-armhf-${{ github.event_name == 'workflow_dispatch' && 'test' || 'release' }}"
          path: release/
          retention-days: "${{ github.event_name == 'workflow_dispatch' && 1 || 30 }}"
