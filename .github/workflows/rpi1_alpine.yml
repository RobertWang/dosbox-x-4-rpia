name: Build DOSBox-X for Alpine ARMv6

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 手动触发
    inputs:
      version_tag:
        description: 'Version Tag (e.g., v1.0.0-test)'
        required: false
        default: 'dev-build'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm/v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Architecture (Critical Step)
        # 主人，这里我们使用 alpine:3.23.3 以确保官方 ARMv6 支持
        # 如果您坚持使用 3.23.3，请在此处修改镜像名
        run: |
          echo "Checking architecture of alpine:3.23.3..."
          ARCH=$(docker run --rm --platform linux/arm/v6 alpine:3.23.3 uname -m)
          echo "Detected Architecture: $ARCH"
          if [[ "$ARCH" != *"armv6"* ]]; then
            echo "Error: Architecture is not ARMv6!"
            exit 1
          fi
       
