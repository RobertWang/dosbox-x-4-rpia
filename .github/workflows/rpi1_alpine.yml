name: Build DOSBox-X for Alpine ARMv6 (3.13)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version Tag (e.g., v1.0.0-test)'
        required: false
        default: 'dev-build'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Register QEMU for ARMv6 (Critical Fix)
        # 主人，这里显式运行 qemu-user-static 来注册 binfmt，比 Action 更可靠
        run: |
          docker run --privileged --rm multiarch/qemu-user-static --reset -p yes

      - name: Build in Alpine Environment
        run: |
          IMAGE="alpine:3.13"
          
          docker run --rm --privileged --platform linux/arm/v6 \
            -v ${{ github.workspace }}:/src -w /src $IMAGE sh -c "
            set -e
            
            echo '=========================================='
            echo 'Step 1: Fixing EOL Repositories'
            echo '=========================================='
            sed -i 's/dl-cdn.alpinelinux.org\/alpine\/v3.13/dl-cdn.alpinelinux.org\/alpine\/archive\/v3.13/g' /etc/apk/repositories
            apk update
            
            echo '=========================================='
            echo 'Step 2: Verifying Container Architecture'
            echo '=========================================='
            ARCH=\$(uname -m)
            echo \"Detected Architecture: \$ARCH\"
            
            # 严格检查：必须是 armv6l
            if [[ \"\$ARCH\" == *"armv6"* ]]; then
              echo \"SUCCESS: True ARMv6 detected.\"
            else
              echo \"WARNING: Architecture is \$ARCH, not armv6l!\"
              echo \"This binary may NOT run on Raspberry Pi Model A.\"
              # 这里我们不退出，让您看到结果，但建议您看到 armv7l 后切换 Debian
            fi
            
            echo '=========================================='
            echo 'Step 3: Installing Build Dependencies'
            echo '=========================================='
            apk add --no-cache \
              git g++ make cmake pkgconf \
              sdl2-dev libpng-dev libjpeg-turbo-dev \
              libogg-dev libvorbis-dev opusfile-dev flac-dev \
              alsa-lib-dev ncurses-dev readline-dev zlib-dev \
              linux-headers musl-dev autoconf automake libtool nasm
            
            echo '=========================================='
            echo 'Step 4: Configuring DOSBox-X'
            echo '=========================================='
            ./buildconf
            ./configure --host=armv6-alpine-linux-musleabihf \
              --prefix=/usr/local \
              --disable-sdl2-test \
              --disable-opengl
            
            echo '=========================================='
            echo 'Step 5: Compiling (Single Thread)'
            echo '=========================================='
            make -j1
            
            echo '=========================================='
            echo 'Step 6: Installing to Package Dir'
            echo '=========================================='
            make install DESTDIR=/pkg
          "

      - name: Create Runtime Dependency Script
        run: |
          cat <<EOF > install_deps.sh
          #!/bin/sh
          echo "=========================================="
          echo "DOSBox-X Runtime Dependency Installer"
          echo "Target: Alpine 3.13 ARMv6"
          echo "=========================================="
          sed -i 's/dl-cdn.alpinelinux.org\/alpine\/v3.13/dl-cdn.alpinelinux.org\/alpine\/archive\/v3.13/g' /etc/apk/repositories
          apk update
          echo "Installing runtime libraries..."
          apk add --no-cache \
            sdl2 libpng libjpeg-turbo \
            libogg libvorbis opusfile flac \
            alsa-lib ncurses-libs readline zlib \
            musl
          echo ""
          echo "=========================================="
          echo "Installation Complete."
          echo "Please run: export PATH=\$PATH:/usr/local/bin"
          echo "Then run: dosbox-x"
          echo "=========================================="
          EOF
          chmod +x install_deps.sh

      - name: Package Artifacts
        run: |
          tar -czvf dosbox-x-alpine-armv6.tar.gz -C /pkg .
          tar -rvf dosbox-x-alpine-armv6.tar.gz install_deps.sh
          echo "Package size:"
          ls -lh dosbox-x-alpine-armv6.tar.gz

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dosbox-x-alpine-armv6.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload Artifact for Manual Dispatch
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: dosbox-x-dev-build
          path: dosbox-x-alpine-armv6.tar.gz
