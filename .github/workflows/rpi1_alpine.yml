name: Build DOSBox-X for Debian Buster ARMv6

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version Tag (e.g., v1.0.0-test)'
        required: false
        default: 'dev-build'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Dockerfile
        run: |
          cat <<EOF > Dockerfile
          FROM arm32v5/debian:buster
          
          # 指向 archive 源（Buster 已 EOL）
          RUN echo "deb http://archive.debian.org/debian buster main contrib non-free" > /etc/apt/sources.list && \
              echo "deb-src http://archive.debian.org/debian buster main contrib non-free" >> /etc/apt/sources.list && \
              apt-get update && \
              apt-get install -y --no-install-recommends \
                git build-essential cmake pkg-config \
                libsdl2-dev libpng-dev libjpeg-dev \
                libogg-dev libvorbis-dev libopusfile-dev libflac-dev \
                libasound2-dev libncurses5-dev libreadline-dev zlib1g-dev \
                autoconf automake libtool nasm
          
          WORKDIR /src
          COPY . .
          
          # 主人，注意这里：直接使用 configure，不依赖 buildconf/autogen.sh
          RUN if [ -f "./configure" ]; then \
                echo "Configure script found, proceeding..."; \
              elif [ -f "./autogen.sh" ]; then \
                chmod +x ./autogen.sh && ./autogen.sh; \
              elif [ -f "./buildconf" ]; then \
                chmod +x ./buildconf && ./buildconf; \
              else \
                echo "ERROR: No configure, autogen.sh, or buildconf found!"; \
                exit 1; \
              fi && \
              ./configure --prefix=/usr/local --disable-sdl2-test --disable-opengl && \
              make -j1 && \
              make install DESTDIR=/pkg
          EOF
          echo "Dockerfile created:"
          cat Dockerfile

      - name: Build using Docker Buildx
        run: |
          docker buildx build --platform linux/arm/v6 --load -t dosbox-x-build -f Dockerfile .
          
          # 提取产物
          docker create --name temp-container dosbox-x-build
          docker cp temp-container:/pkg ./pkg
          docker rm temp-container
          
          echo "Build artifacts extracted:"
          ls -la ./pkg

      - name: Create Runtime Dependency Script
        run: |
          cat <<EOF > install_deps.sh
          #!/bin/sh
          echo "=========================================="
          echo "DOSBox-X Runtime Dependency Installer"
          echo "Target: Debian Buster ARMv6"
          echo "=========================================="
          echo "deb http://archive.debian.org/debian buster main contrib non-free" > /etc/apt/sources.list
          apt-get update
          echo "Installing runtime libraries..."
          apt-get install -y --no-install-recommends \
            libsdl2-2.0-0 libpng16-16 libjpeg62-turbo \
            libogg0 libvorbis0a libopusfile0 libflac8 \
            libasound2 libncurses5 libreadline7 zlib1g
          echo ""
          echo "=========================================="
          echo "Installation Complete."
          echo "Please run: export PATH=\$PATH:/usr/local/bin"
          echo "Then run: dosbox-x"
          echo "=========================================="
          EOF
          chmod +x install_deps.sh

      - name: Package Artifacts
        run: |
          tar -czvf dosbox-x-debian-armv6.tar.gz -C ./pkg .
          tar -rvf dosbox-x-debian-armv6.tar.gz install_deps.sh
          echo "Package size:"
          ls -lh dosbox-x-debian-armv6.tar.gz

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dosbox-x-debian-armv6.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload Artifact for Manual Dispatch
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: dosbox-x-dev-build
          path: dosbox-x-debian-armv6.tar.gz
