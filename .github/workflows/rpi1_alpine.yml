name: Build DOSBox-X for Alpine ARMv6 (3.23.3)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version Tag (e.g., v1.0.0-test)'
        required: false
        default: 'dev-build'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU (Fixed Version)
        # 主人，这里修正了版本标签为 latest，并确保在 docker run 之前执行
        uses: tonistiigi/binfmt@latest
        with:
          platforms: arm,v6

      - name: Build in Alpine Environment
        run: |
          IMAGE="alpine:3.23.3"
          
          # 主人，注意：这里指定了 platform 为 arm/v6
          docker run --rm --privileged --platform linux/arm/v6 \
            -v ${{ github.workspace }}:/src -w /src $IMAGE sh -c "
            set -e
            
            echo '=========================================='
            echo 'Step 1: Verifying Container Architecture'
            echo '=========================================='
            ARCH=\$(uname -m)
            echo \"Detected Architecture: \$ARCH\"
            
            # 关键检查：如果容器内不是 armv6l，说明镜像不支持 ARMv6，构建将无法在 Pi A 上运行
            if [[ \"\$ARCH\" != *"armv6"* ]]; then
              echo \"ERROR: Container architecture (\$ARCH) is not ARMv6!\"
              echo \"This binary will NOT run on Raspberry Pi Model A.\"
              exit 1
            fi
            
            echo '=========================================='
            echo 'Step 2: Installing Build Dependencies'
            echo '=========================================='
            apk update
            apk add --no-cache \
              git g++ make cmake pkgconf \
              sdl2-dev libpng-dev libjpeg-turbo-dev \
              libogg-dev libvorbis-dev opusfile-dev flac-dev \
              alsa-lib-dev ncurses-dev readline-dev zlib-dev \
              linux-headers musl-dev autoconf automake libtool nasm
            
            echo '=========================================='
            echo 'Step 3: Configuring DOSBox-X'
            echo '=========================================='
            ./buildconf
            ./configure --host=armv6-alpine-linux-musleabihf \
              --prefix=/usr/local \
              --disable-sdl2-test \
              --disable-opengl
            
            echo '=========================================='
            echo 'Step 4: Compiling (Single Thread)'
            echo '=========================================='
            make -j1
            
            echo '=========================================='
            echo 'Step 5: Installing to Package Dir'
            echo '=========================================='
            make install DESTDIR=/pkg
          "

      - name: Create Runtime Dependency Script
        run: |
          cat <<EOF > install_deps.sh
          #!/bin/sh
          echo "=========================================="
          echo "DOSBox-X Runtime Dependency Installer"
          echo "Target: Alpine 3.23.3 ARMv6"
          echo "=========================================="
          echo "Updating package list..."
          apk update
          echo "Installing runtime libraries..."
          apk add --no-cache \
            sdl2 libpng libjpeg-turbo \
            libogg libvorbis opusfile flac \
            alsa-lib ncurses-libs readline zlib \
            musl
          echo ""
          echo "=========================================="
          echo "Installation Complete."
          echo ""
          echo "IMPORTANT: Please run the following commands:"
          echo "  export PATH=\$PATH:/usr/local/bin"
          echo "  export SDL_VIDEO_DRIVER=x11"
          echo ""
          echo "Then run: dosbox-x"
          echo "=========================================="
          EOF
          chmod +x install_deps.sh

      - name: Package Artifacts
        run: |
          # 打包编译好的文件
          tar -czvf dosbox-x-alpine-armv6.tar.gz -C /pkg .
          # 将依赖脚本也打包进根目录
          tar -rvf dosbox-x-alpine-armv6.tar.gz install_deps.sh
          echo "Package size:"
          ls -lh dosbox-x-alpine-armv6.tar.gz

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dosbox-x-alpine-armv6.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload Artifact for Manual Dispatch
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: dosbox-x-dev-build
          path: dosbox-x-alpine-armv6.tar.gz
