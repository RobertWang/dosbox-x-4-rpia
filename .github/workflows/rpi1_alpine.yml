name: Build DOSBox-X for Alpine ARMv6 (3.13)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version Tag (e.g., v1.0.0-test)'
        required: false
        default: 'dev-build'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU (Official Action)
        # 主人，这是官方动作，通常最可靠
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Diagnose QEMU Registration (Critical)
        # 主人，这一步非常关键，用于确认 QEMU 是否真的注册成功了
        run: |
          echo "Checking binfmt_misc..."
          ls -l /proc/sys/fs/binfmt_misc/
          if [ ! -f /proc/sys/fs/binfmt_misc/qemu-arm ]; then
            echo "ERROR: QEMU ARM interpreter not found!"
            echo "GitHub Actions runner does not support ARM emulation."
            exit 1
          else
            echo "SUCCESS: QEMU ARM interpreter found."
            cat /proc/sys/fs/binfmt_misc/qemu-arm
          fi

      - name: Build using Docker Buildx
        # 主人，使用 buildx 通常比 docker run 更稳定
        run: |
          IMAGE="alpine:3.13"
          
          # 创建一个临时 Dockerfile 用于构建
          cat <<EOF > Dockerfile.build
          FROM ${IMAGE}
          RUN sed -i 's/dl-cdn.alpinelinux.org\/alpine\/v3.13/dl-cdn.alpinelinux.org\/alpine\/archive\/v3.13/g' /etc/apk/repositories
          RUN apk update && apk add --no-cache \
            git g++ make cmake pkgconf \
            sdl2-dev libpng-dev libjpeg-turbo-dev \
            libogg-dev libvorbis-dev opusfile-dev flac-dev \
            alsa-lib-dev ncurses-dev readline-dev zlib-dev \
            linux-headers musl-dev autoconf automake libtool nasm
          WORKDIR /src
          COPY . .
          RUN ./buildconf && \
              ./configure --host=armv6-alpine-linux-musleabihf --prefix=/usr/local --disable-sdl2-test --disable-opengl && \
              make -j1 && \
              make install DESTDIR=/pkg
          EOF
          
          # 构建镜像
          docker buildx build --platform linux/arm/v6 --load -t dosbox-x-build .
          
          # 从镜像中复制产物
          docker create --name temp-container dosbox-x-build
          docker cp temp-container:/pkg ./pkg
          docker rm temp-container

      - name: Create Runtime Dependency Script
        run: |
          cat <<EOF > install_deps.sh
          #!/bin/sh
          echo "=========================================="
          echo "DOSBox-X Runtime Dependency Installer"
          echo "Target: Alpine 3.13 ARMv6"
          echo "=========================================="
          sed -i 's/dl-cdn.alpinelinux.org\/alpine\/v3.13/dl-cdn.alpinelinux.org\/alpine\/archive\/v3.13/g' /etc/apk/repositories
          apk update
          echo "Installing runtime libraries..."
          apk add --no-cache \
            sdl2 libpng libjpeg-turbo \
            libogg libvorbis opusfile flac \
            alsa-lib ncurses-libs readline zlib \
            musl
          echo ""
          echo "=========================================="
          echo "Installation Complete."
          echo "Please run: export PATH=\$PATH:/usr/local/bin"
          echo "Then run: dosbox-x"
          echo "=========================================="
          EOF
          chmod +x install_deps.sh

      - name: Package Artifacts
        run: |
          tar -czvf dosbox-x-alpine-armv6.tar.gz -C ./pkg .
          tar -rvf dosbox-x-alpine-armv6.tar.gz install_deps.sh
          echo "Package size:"
          ls -lh dosbox-x-alpine-armv6.tar.gz

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dosbox-x-alpine-armv6.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload Artifact for Manual Dispatch
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: dosbox-x-dev-build
          path: dosbox-x-alpine-armv6.tar.gz
