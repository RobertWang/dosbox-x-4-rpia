name: Build DOSBox-X for Alpine ARMv6

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version Tag (e.g., v1.0.0-test)'
        required: false
        default: 'dev-build'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU (Critical Fix)
        # 主人，这里使用了正确的标签 latest，并且配置了 arm/v6 支持
        # 这一步必须在所有 docker run 命令之前执行
        uses: tonistiigi/binfmt@latest
        with:
          platforms: arm,v6

      - name: Build in Alpine Environment
        run: |
          IMAGE="alpine:3.13"
          
          docker run --rm --privileged --platform linux/arm/v6 \
            -v ${{ github.workspace }}:/src -w /src $IMAGE sh -c "
            set -e
            
            # 主人，注意这里：因为 3.13 已 EOL，需要切换到 archive 源
            echo 'Fixing APK repositories for EOL version...'
            sed -i 's/dl-cdn.alpinelinux.org\/alpine\/v3.13/dl-cdn.alpinelinux.org\/alpine\/archive\/v3.13/g' /etc/apk/repositories
            
            echo 'Updating apk...'
            apk update
            
            echo 'Installing build dependencies...'
            apk add --no-cache \
              git g++ make cmake pkgconf \
              sdl2-dev libpng-dev libjpeg-turbo-dev \
              libogg-dev libvorbis-dev opusfile-dev flac-dev \
              alsa-lib-dev ncurses-dev readline-dev zlib-dev \
              linux-headers musl-dev autoconf automake libtool nasm
            
            echo 'Verifying Architecture...'
            uname -m
            # 如果这里输出 armv6l，说明 QEMU 工作正常
            
            echo 'Configuring...'
            ./buildconf
            ./configure --host=armv6-alpine-linux-musleabihf \
              --prefix=/usr/local \
              --disable-sdl2-test \
              --disable-opengl
            
            echo 'Compiling (Single Thread)...'
            make -j1
            
            echo 'Installing to pkg...'
            make install DESTDIR=/pkg
          "

      - name: Create Runtime Dependency Script
        run: |
          cat <<EOF > install_deps.sh
          #!/bin/sh
          # 注意：运行时也需要使用 archive 源，因为 3.13 已 EOL
          sed -i 's/dl-cdn.alpinelinux.org\/alpine\/v3.13/dl-cdn.alpinelinux.org\/alpine\/archive\/v3.13/g' /etc/apk/repositories
          apk update
          apk add --no-cache \
            sdl2 libpng libjpeg-turbo \
            libogg libvorbis opusfile flac \
            alsa-lib ncurses-libs readline zlib \
            musl
          echo "Dependencies installed."
          echo "Please run: export PATH=\$PATH:/usr/local/bin"
          EOF
          chmod +x install_deps.sh

      - name: Package Artifacts
        run: |
          tar -czvf dosbox-x-alpine-armv6.tar.gz -C /pkg .
          tar -rvf dosbox-x-alpine-armv6.tar.gz install_deps.sh

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dosbox-x-alpine-armv6.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload Artifact for Manual Dispatch
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: dosbox-x-dev-build
          path: dosbox-x-alpine-armv6.tar.gz
